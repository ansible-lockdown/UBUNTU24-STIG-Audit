---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_700020 }}
command:
  journal_file_perms:
    title: UBTU-24-700020 | Ubuntu 24.04 LTS must generate system journal entries without revealing information that could be exploited by adversaries.
    exec: |
      JOURNAL_DIR_PERM=$(find /run/log/journal /var/log/journal -type d -perm /5022 -printf '.' 2>/dev/null | wc -c); \
      JOURNAL_FILE_PERM=$(find /run/log/journal /var/log/journal -type f -perm /7137 -printf '.' 2>/dev/null | wc -c); \
      if [ "$JOURNAL_DIR_PERM" -eq 0 ] && [ "$JOURNAL_FILE_PERM" -eq 0 ]; \
      then echo "OK - No files or Directories found"; \
      else echo "FAIL - Files found"; \
      fi
    exit-status: 0
    stdout:
      - '/OK - No files or Directories found/'
    meta:
      Cat: 2
      CCI: CCI-001312
      Group_Title: SRG-OS-000205-GPOS-00083
      NIST800-53R4: SI-11
      Rule_ID: SV-270757r1261493_rule
      STIG_ID: UBTU-24-700020
      Vul_ID: V-270757
  journal_file_perms_conf:
    title: UBTU-24-700020 | Ubuntu 24.04 LTS must generate system journal entries without revealing information that could be exploited by adversaries. | tmpfiles
    exec: |
      systemd-tmpfiles --cat-config 2>/dev/null | awk '$1 ~ /^[zZ]$/ && $2 ~ /^\/(run|var)\/log\/journal(\/%m(\/system\.journal)?)?$/ {l[$2]=$1" "$2" "$3" "$4" "$5} END {for (p in l) print l[p]}'
    exit-status: 0
    stdout:
      - '/^z /run/log/journal 2755 root systemd-journal$/'
      - '/^Z /run/log/journal/%m ~2750 root systemd-journal$/'
      - '/^z /var/log/journal 2755 root systemd-journal$/'
      - '/^z /var/log/journal/%m 2755 root systemd-journal$/'
      - '/^z /var/log/journal/%m/system\.journal 0640 root systemd-journal$/'
    meta:
      Cat: 2
      CCI: CCI-001312
      Group_Title: SRG-OS-000205-GPOS-00083
      NIST800-53R4: SI-11
      Rule_ID: SV-270757r1261493_rule
      STIG_ID: UBTU-24-700020
      Vul_ID: V-270757
  {{ end }}
{{ end }}
