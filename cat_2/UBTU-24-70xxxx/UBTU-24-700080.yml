---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_700080 }}
command:
  journald_dirs_owned_conf:
    title: UBTU-24-700080 | Ubuntu 24.04 LTS must configure the directories used by the system journal to be owned by "root".
    exec: |
      systemd-tmpfiles --cat-config 2>/dev/null | awk '$1 ~ /^[zZ]$/ && $2 ~ /^\/(run|var)\/log\/journal(\/%m(\/system\.journal)?)?$/ {l[$2]=$1" "$2" "$3" "$4" "$5} END {for (p in l) print l[p]}'
    exit-status: 0
    stdout:
      - '/^z /run/log/journal 2755 root \S+$/'
      - '/^z /var/log/journal 2755 root \S+$/'
    meta:
      Cat: 2
      CCI: CCI-001314
      Group_Title: SRG-OS-000206-GPOS-00084
      NIST800-53R4: SI-11
      Rule_ID: SV-270763r1261497_rule
      STIG_ID: UBTU-24-700080
      Vul_ID: V-270763
  {{ end }}
{{ end }}
