---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_700070 }}
command:
  journald_files_group_owned_conf:
    title: UBTU-24-700070 | Ubuntu 24.04 LTS must configure the files used by the system journal to be group-owned by "systemd-journal".
    exec: |
      systemd-tmpfiles --cat-config 2>/dev/null | awk '$1 ~ /^[zZ]$/ && $2 ~ /^\/(run|var)\/log\/journal\/%m(\/system\.journal)?$/ {l[$2]=$1" "$2" "$3" "$4" "$5} END {for (p in l) print l[p]}'
    exit-status: 0
    stdout:
      - '/^Z /run/log/journal/%m \S+ \S+ systemd-journal$/'
      - '/^z /var/log/journal/%m \S+ \S+ systemd-journal$/'
      - '/^z /var/log/journal/%m/system\.journal \S+ \S+ systemd-journal$/'
    meta:
      Cat: 2
      CCI: CCI-001314
      Group_Title: SRG-OS-000206-GPOS-00084
      NIST800-53R4: SI-11
      Rule_ID: SV-270762r1184076_rule
      STIG_ID: UBTU-24-700070
      Vul_ID: V-270762
  journald_files_group_owned_live:
    title: UBTU-24-700070 | Ubuntu 24.04 LTS must configure the files used by the system journal to be group-owned by "systemd-journal".
    exec: find /run/log/journal /var/log/journal -type f ! -group systemd-journal 2>/dev/null; true
    exit-status: 0
    stdout:
      - '!/./'
    meta:
      Cat: 2
      CCI: CCI-001314
      Group_Title: SRG-OS-000206-GPOS-00084
      NIST800-53R4: SI-11
      Rule_ID: SV-270762r1184076_rule
      STIG_ID: UBTU-24-700070
      Vul_ID: V-270762
  {{ end }}
{{ end }}
