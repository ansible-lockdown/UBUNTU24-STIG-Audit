---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_300016 }}
file:
  passwd_enforce:
    title: UBTU-24-300016 | Ubuntu 24.04 LTS must be configured so that when passwords are changed or new passwords are established, pwquality must be used.
    path: /etc/security/pwquality.conf
    exists: true
    contents:
    - '/^enforcing\s*=\s*1$/'
    meta:
      Cat: 2
      CCI: CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00225
      NIST800-53R4: CM-6
      Rule_ID: SV-270705r1066604_rule
      STIG_ID: UBTU-24-300016
      Vul_ID: V-270705
  common-password-retry:
    title: UBTU-24-300016 | Ubuntu 24.04 LTS must be configured so that when passwords are changed or new passwords are established, pwquality must be used.
    path: /etc/pam.d/common-password
    exists: true
    contents:
    - '/^password.*pam_pwquality.so.*retry=[1-3]/'
    meta:
      Cat: 2
      CCI: CCI-000366
      Group_Title:
      - SRG-OS-000480-GPOS-00225
      NIST800-53R4: CM-6
      Rule_ID: SV-270705r1066604_rule
      STIG_ID: UBTU-24-300016
      Vul_ID: V-270705
  {{ end }}
{{ end }}
