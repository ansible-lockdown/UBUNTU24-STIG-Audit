    exec: grep -Ei '!authenticate' /etc/sudoers /etc/sudoers.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^.*/'
    meta:
      Cat: 2
      CCI: 000366
      Group_Title:
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4: CM-6
      Rule_ID: SV-270707r1101786_rule
      STIG_ID: UBTU-24-300021
      Vul_ID: V-270707
  {{ end }}
