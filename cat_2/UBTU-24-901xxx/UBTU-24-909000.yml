---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_909000 }}
command:
  protect_rules_module_cnf:
    title: UBTU-24-909000 | Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized change. | Config
    exec: grep "\e 2" /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-e 2/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270832r1068399_rule
      STIG_ID: UBTU-24-909000
      Vul_ID: V-270782
  protect_rules_module_live:
    title: UBTU-24-909000 | Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized change. | Live
    exec: auditctl -s
    exit-status: 0
    stdout:
    - 'enabled 2'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270832r1068399_rule
      STIG_ID: UBTU-24-909000
      Vul_ID: V-270782
  {{ end }}
{{ end }}
