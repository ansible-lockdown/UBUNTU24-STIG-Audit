---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_200020 }}
    {{ if .Vars.ubtu24stig_gui }}
command:
  gsettings_lock_inactivity:
    title: UBTU-24-200020 | Ubuntu 24.04 LTS must initiate a graphical session lock after 10 minutes of inactivity.
    exec: echo "lock-enabled $(gsettings get org.gnome.desktop.screensaver lock-enabled)"; echo "lock-delay $(gsettings get org.gnome.desktop.screensaver lock-delay)"; echo "idle-delay $(gsettings get org.gnome.desktop.session idle-delay)"
    exit-status: 0
    stdout:
    - '/^lock-enabled true$/'
    - '/^lock-delay uint32 0$/'
    - '/^idle-delay uint32 ([1-9]|[1-9][0-9]|[1-5][0-9]{2}|600)$/'
    meta:
      Cat: 2
      CCI:
      - CCI-000057
      Group_Title:
      - SRG-OS-000029-GPOS-00010
      NIST800-53R4:
      - AC-11
      Rule_ID: SV-270678r1101791_rule
      STIG_ID: UBTU-24-200020
      Vul_ID: V-270678
    {{ end }}
  {{ end }}
{{ end }}
