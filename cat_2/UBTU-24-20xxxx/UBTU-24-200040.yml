---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_200040 }}
    {{ if .Vars.ubtu24stig_gui }}
command:
  gui_automount_open_locked:
    title: UBTU-24-200040 | Ubuntu 24.04 LTS must prevent a user from overriding the disabling of the graphical user interface automount function.
    exec: grep -hs 'automount-open' /etc/dconf/db/local.d/locks/*
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^\s*\/org\/gnome\/desktop\/media-handling\/automount-open\s*$/'
    meta:
      Cat: 2
      CCI:
      - CCI-000056
      Group_Title:
      - SRG-OS-000028-GPOS-00009
      - SRG-OS-000114-GPOS-00059
      - SRG-OS-000378-GPOS-00163
      - SRG-OS-000480-GPOS-00227
      NIST800-53R4:
      - AC-11
      Rule_ID: SV-270679r1107295_rule
      STIG_ID: UBTU-24-200040
      Vul_ID: V-270679
    {{ end }}
  {{ end }}
{{ end }}
