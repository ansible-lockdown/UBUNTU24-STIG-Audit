---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_200090 }}
command:
  rsyslog_remote_access_logged:
    title: UBTU-24-200090 | Ubuntu 24.04 LTS must monitor remote access methods.
    exec: "grep -Er '^(auth.*,authpriv.*|daemon.*)' /etc/rsyslog.*"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/.*:auth\.\*,authpriv\.\*\s*\/var\/log\/secure/'
    - '/.*:daemon\.\*\s*\/var\/log\/messages/'
    meta:
      Cat: 2
      CCI:
      - CCI-000067
      Group_Title:
      - SRG-OS-000032-GPOS-00013
      NIST800-53R4: AC-17
      Rule_ID: SV-270681r1134806_rule
      STIG_ID: UBTU-24-200090
      Vul_ID: V-270688
  {{ end }}
{{ end }}
