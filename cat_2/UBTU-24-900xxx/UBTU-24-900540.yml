---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900540 }}
command:
  unlink_module_cnf:
    title: UBTU-24-900540 | Ubuntu 24.04 LTS must generate audit records for any successful/unsuccessful use of unlink, unlinkat, rename, renameat, and rmdir system calls. | Config
    exec: grep unlink /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,rmdir -F auid>=1000 -F auid!=(unset|-1) -k delete/'
    - '/(.*:|)-a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,rmdir -F auid>=1000 -F auid!=(unset|-1) -k delete/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000468-GPOS-00212
      NIST800-53R4:
      - AU-12
      Rule_ID: SV-270809r1068388_rule
      STIG_ID: UBTU-24-900540
      Vul_ID: V-270809
  unlink_module_live:
    title: UBTU-24-900540 | Ubuntu 24.04 LTS must generate audit records for any successful/unsuccessful use of unlink, unlinkat, rename, renameat, and rmdir system calls. | Live
    exec: auditctl -l | grep unlink
    exit-status: 0
    stdout:
    - '-a always,exit -F arch=b64 -S rename,rmdir,unlink,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F key=delete'
    - '-a always,exit -F arch=b32 -S unlink,rename,rmdir,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F key=delete'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000468-GPOS-00212
      NIST800-53R4:
      - AU-12
      Rule_ID: SV-270809r1068388_rule
      STIG_ID: UBTU-24-900540
      Vul_ID: V-270809
  {{ end }}
{{ end }}
