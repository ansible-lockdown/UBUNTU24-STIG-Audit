---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900110 }}
command:
  ssh-agent_module_cnf:
    title: UBTU-24-900110 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the ssh-agent command. | Config
    exec: grep ssh-agent /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/bin/ssh-agent -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k privileged-ssh/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-2270782r1066835_rule
      STIG_ID: UBTU-24-900110
      Vul_ID: V-2270782
  ssh-agent_module_live:
    title: UBTU-24-900110 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the ssh-agent command. | Live
    exec: auditctl -l | grep ssh-agent
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/bin/ssh-agent -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-ssh'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270782r1066835_rule
      STIG_ID: UBTU-24-900110
      Vul_ID: V-270782
  {{ end }}
{{ end }}
