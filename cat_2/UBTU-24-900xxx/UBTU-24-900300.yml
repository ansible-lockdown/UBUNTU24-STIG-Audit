---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900300 }}
command:
  chage_module_cnf:
    title: UBTU-24-900300 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the chage command. | Config
    exec: grep chage /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k privileged-chage/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270801r1066892_rule
      STIG_ID: UBTU-24-900300
      Vul_ID: V-270801
  chage_module_live:
    title: UBTU-24-900300 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the chage command. | Live
    exec: auditctl -l | grep chage
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-chage'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270801r1066892_rule
      STIG_ID: UBTU-24-900300
      Vul_ID: V-270801
  {{ end }}
{{ end }}
