---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900200 }}
command:
  newgrp_module_cnf:
    title: UBTU-24-900200 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the newgrp command. | Config
    exec: grep newgrp /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/bin/newgrp -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k priv_cmd/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270791r1066862_rule
      STIG_ID: UBTU-24-900200
      Vul_ID: V-270791
  newgrp_module_live:
    title: UBTU-24-900200 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the newgrp command. | Live
    exec: auditctl -l | grep newgrp
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/bin/newgrp -F perm=x -F auid>=1000 -F auid!=-1 -F key=priv_cmd'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270791r1066862_rule
      STIG_ID: UBTU-24-900200
      Vul_ID: V-270791
  {{ end }}
{{ end }}
