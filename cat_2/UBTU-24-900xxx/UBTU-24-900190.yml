---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900190 }}
command:
  chsh_module_cnf:
    title: UBTU-24-900190 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the chsh command. | Config
    exec: grep chsh /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/bin/chsh -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k priv_cmd/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270790r1068380_rule
      STIG_ID: UBTU-24-900190
      Vul_ID: V-270790
  chsh_module_live:
    title: UBTU-24-900190 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the chsh command. | Live
    exec: auditctl -l | grep chsh
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/bin/chsh -F perm=x -F auid>=1000 -F auid!=-1 -F key=priv_cmd'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270790r1068380_rule
      STIG_ID: UBTU-24-900190
      Vul_ID: V-270790
  {{ end }}
{{ end }}
