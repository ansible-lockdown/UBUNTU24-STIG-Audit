---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900100 }}
command:
  umount_module_cnf:
    title: UBTU-24-900100 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the umount command. | Config
    exec: grep umount /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/bin/umount -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k privileged-umount/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270781r1066832_rule
      STIG_ID: UBTU-24-900100
      Vul_ID: V-2270781
  umount_module_live:
    title: UBTU-24-900100 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the umount command. | Live
    exec: auditctl -l | grep umount
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/bin/umount -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-umount'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270781r1066832_rule
      STIG_ID: UBTU-24-900100
      Vul_ID: V-270781
  {{ end }}
{{ end }}
