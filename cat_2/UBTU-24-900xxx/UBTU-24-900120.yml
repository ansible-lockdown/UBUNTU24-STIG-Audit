---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900120 }}
command:
  ssh-keysign_module_cnf:
    title: UBTU-24-900120 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the ssh-keysign command. | Config
    exec: grep ssh-keysign /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/lib/openssh/ssh-keysign -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k privileged-ssh/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270783r1066838_rule
      STIG_ID: UBTU-24-900120
      Vul_ID: V-270782
  ssh-keysign_module_live:
    title: UBTU-24-900120 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the ssh-keysign command. | Live
    exec: auditctl -l | grep ssh-keysign
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/lib/openssh/ssh-keysign -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-ssh'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270783r1066838_rule
      STIG_ID: UBTU-24-900120
      Vul_ID: V-270782
  {{ end }}
{{ end }}
