---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900320 }}
command:
  crontab_module_cnf:
    title: UBTU-24-900320 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the crontab command. | Config
    exec: grep crontab /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/bin/crontab -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k privileged-crontab/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270803r1066898_rule
      STIG_ID: UBTU-24-900320
      Vul_ID: V-270803
  crontab_module_live:
    title: UBTU-24-900320 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the crontab command. | Live
    exec: auditctl -l | grep crontab
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/bin/crontab -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-crontab'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270803r1066898_rule
      STIG_ID: UBTU-24-900320
      Vul_ID: V-270803
  {{ end }}
{{ end }}
