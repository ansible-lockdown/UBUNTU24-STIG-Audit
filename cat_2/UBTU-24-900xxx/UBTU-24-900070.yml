---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900070 }}
command:
  su_module_cnf:
    title: UBTU-24-900070 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the su command. | Config
    exec: grep su /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/bin/su -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k privileged-priv_change/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270778r1066823_rule
      STIG_ID: UBTU-24-900070
      Vul_ID: V-270778
  su_module_live:
    title: UBTU-24-900070 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the su command. | Live
    exec: auditctl -l | grep su
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/bin/su -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-priv_change'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270778r1066823_rule
      STIG_ID: UBTU-24-900070
      Vul_ID: V-270778
  {{ end }}
{{ end }}
