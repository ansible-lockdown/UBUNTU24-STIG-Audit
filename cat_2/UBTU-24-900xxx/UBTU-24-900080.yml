---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900080 }}
command:
  chfn_module_cnf:
    title: UBTU-24-900080 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the chfn command. | Config
    exec: grep chfn /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-a always,exit -F path=/usr/bin/chfn -F perm=x -F auid>=1000 -F auid!=(unset|-1) -k privileged-chfn/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270779r1066826_rule
      STIG_ID: UBTU-24-900080
      Vul_ID: V-270779
  chfn_module_live:
    title: UBTU-24-900080 | Ubuntu 24.04 LTS must generate audit records for successful/unsuccessful uses of the chfn command. | Live
    exec: auditctl -l | grep chfn
    exit-status: 0
    stdout:
    - '-a always,exit -S all -F path=/usr/bin/chfn -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-chfn'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000064-GPOS-00033
      NIST800-53R4: AU-12
      Rule_ID: SV-270779r1066826_rule
      STIG_ID: UBTU-24-900080
      Vul_ID: V-270779
  {{ end }}
{{ end }}
