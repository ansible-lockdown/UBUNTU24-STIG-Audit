---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_900510 }}
command:
  sudoers_module_cnf:
    title: UBTU-24-900510 | Ubuntu 24.04 LTS must generate audit records when successful/unsuccessful attempts to modify the /etc/sudoers file occur. | Config
    exec: grep sudoers /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-w /etc/sudoers -p wa -k privilege_modification/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000466-GPOS-00210
      NIST800-53R4:
      - AU-12
      Rule_ID: SV-270807r1066910_rule
      STIG_ID: UBTU-24-900510
      Vul_ID: V-270807
  sudoers_module_live:
    title: UBTU-24-900510 | Ubuntu 24.04 LTS must generate audit records when successful/unsuccessful attempts to modify the /etc/sudoers file occur. | Live
    exec: auditctl -l | grep sudoers
    exit-status: 0
    stdout:
    - '-w /etc/sudoers -p wa -k privilege_modification'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000466-GPOS-00210
      NIST800-53R4:
      - AU-12
      Rule_ID: SV-270807r1066910_rule
      STIG_ID: UBTU-24-900510
      Vul_ID: V-270807
  {{ end }}
{{ end }}
