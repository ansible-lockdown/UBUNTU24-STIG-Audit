---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_400220 }}
file:
  common-password-sha:
    title: UBTU-24-400220 | Ubuntu 24.04 LTS must store only encrypted representations of passwords.
    path: /etc/pam.d/common-password
    exists: true
    contents:
    - '/^password.*pam_unix.so.*{{ .Vars.ubtu24stig_passwd_hash_algo }}/'
    # The check-content fails when rounds is set below 100000, so anything with fewer than
    # six digits is a finding. Written as a literal range rather than a .Vars reference on
    # purpose: a new .Vars key would hard-abort this whole audit under missingkey=error when
    # a newer audit branch is run against an older remediation that does not emit it.
    - '/^password.*pam_unix\.so.*rounds=[1-9][0-9]{5,}/'
    meta:
      Cat: 2
      CCI: NA
      Group_Title:
      - SRG-OS-000073-GPOS-00041
      NIST800-53R4: NA
      Rule_ID: SV-270725r1101789_rule
      STIG_ID: UBTU-24-400220
      Vul_ID: V-270725
  {{ end }}
{{ end }}
