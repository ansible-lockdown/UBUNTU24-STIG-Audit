---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_400060 }}
    {{ if .Vars.ubtu24stig_use_sssd }}
command:
  ocsp_on_pki_required:
    title: UBTU-24-400060 | Ubuntu 24.04 LTS must electronically verify personal identity verification (PIV) credentials.
    exec: >-
      awk '/pkcs11_module opensc {/,/}/' /etc/pam_pkcs11/pam_pkcs11.conf | grep -E '^\s*cert_policy\s*=' | awk '{ print ($0 ~ /ocsp_on/ ? "ocsp_on_present " : "ocsp_on_missing ") $0 }'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^ocsp_on_present /'
    - '!/^ocsp_on_missing /'
    meta:
      Cat: 2
      CCI:
      - CCI-001954
      Group_Title:
      - SRG-OS-000377-GPOS-00162
      NIST800-53R4: IA-2
      Rule_ID: SV-270723r1066658_rule
      STIG_ID: UBTU-24-400060
      Vul_ID: V-270723
    {{ end }}
  {{ end }}
{{ end }}
