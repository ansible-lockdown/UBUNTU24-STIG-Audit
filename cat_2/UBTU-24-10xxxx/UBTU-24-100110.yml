---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_100110 }}
command:
    {{ if .Vars.ubtu24stig_allow_aide_check }}
  aide_check:
    title: UBTU-24-100110 | Ubuntu 24.04 LTS must configure AIDE to perform file integrity checking on the file system if installed.
    exec: aide -c /etc/aide/aide.conf --check
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/AIDE found differences between database and filesystem!!/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      NIST800-53R4: SI-6
      Rule_ID: SV-270650r1155241_rule
      STIG_ID: UBTU-24-100110
      Vul_ID: V-270650
  {{ end }}
  {{ if not .Vars.ubtu24stig_allow_aide_check }}
  ubtu24stig_allow_aide_check:
    title: UBTU-24-100110 | Ubuntu 24.04 LTS must configure AIDE to perform file integrity checking on the file system if installed.
    exec: echo "Aide Check to be run manually due to system impact"
    exit-status: 0
    stdout:
    - '!/Aide Check to be run manually due to system impact!!/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      NIST800-53R4: SI-6
      Rule_ID: SV-270650r1155241_rule
      STIG_ID: UBTU-24-100110
      Vul_ID: V-270650
    {{ end }}
  {{ end }}
{{ end }}
