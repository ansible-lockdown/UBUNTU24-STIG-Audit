---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_100120 }}
command:
  aide_cron_sha:
    title: UBTU-24-100120 | Ubuntu 24.04 LTS must be configured so that the script which runs each 30 days or less to check file integrity is the default one.
    exec: grep -r aide /etc/cron* /etc/crontab && systemctl list-timers | grep aide
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - 'SCRIPT="/usr/share/aide/bin/dailyaidecheck"'
    - '/.*- dailyaidecheck.timer         dailyaidecheck.service/'
    meta:
      Cat: 2
      CCI:
      - CCI-002699
      Group_Title:
      - SRG-OS-000446-GPOS-00200
      NIST800-53R4: SI-6
      Rule_ID: SV-270651r1068395_rule
      STIG_ID: UBTU-24-100120
      Vul_ID: V-270651
  {{ end }}
{{ end }}
