---

{{ if .Vars.ubtu24stig_cat2 }}
  {{ if .Vars.ubtu24stig_100840 }}
file:
  sshd_kex_conf:
    title: UBTU-24-100840 | Ubuntu 24.04 LTS SSH server must be configured to use only FIPS 140-3 validated key exchange algorithms. | conf
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    # Goss `contents` matcher: slash-delimited = regex, no slashes = literal
    # substring. The variable value contains 'diffie-hellman-group-...' which
    # caused the Go regex parser to misinterpret 'n-g' as a character-class
    # range. Using a literal substring match avoids regex parsing entirely and
    # preserves the full value-aware verification.
    - 'KexAlgorithms {{ .Vars.ubtu24stig_sshd_config_kex }}'
    meta:
      Cat: 2
      CCI:
      - CCI-000068
      Group_Title:
      - SRG-OS-000033-GPOS-00014
      NIST800-53R4:
      - AC-17
      Rule_ID: SV-270669r1134804_rule
      STIG_ID: UBTU-24-100840
      Vul_ID: V-270669
command:
  sshd_kex_running:
    title: UBTU-24-100840 | Ubuntu 24.04 LTS SSH server must be configured to use only FIPS 140-3 validated key exchange algorithms. | running
    exec: sshd -T | grep -i KexAlgorithms
    exit-status: 0
    stdout:
    # Literal substring match (slash-less) — preserves the full value check
    # without tripping the Go regex parser on 'diffie-hellman-group-...'.
    # sshd -T output is lowercase, the variable value is the literal list.
    - 'kexalgorithms {{ .Vars.ubtu24stig_sshd_config_kex }}'
    meta:
      Cat: 2
      CCI:
      - CCI-000068
      Group_Title:
      - SRG-OS-000033-GPOS-00014
      NIST800-53R4:
      - AC-17
      Rule_ID: SV-270669r1134804_rule
      STIG_ID: UBTU-24-100840
      Vul_ID: V-270669
  {{ end }}
{{ end }}
