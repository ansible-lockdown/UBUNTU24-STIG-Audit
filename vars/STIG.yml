  - By using this IS (which includes any device attached to this IS), you consent to the following conditions
  - -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
  - -At any time, the USG may inspect and seize data stored on this IS.
  - -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
  - -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.
  - -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.

# 215xxx
## Chrony
ubtu24stig_time_synchronization_servers:
- 'tick.usno.navy.mil'
- 'tock.usno.navy.mil'
- 'ntp2.usno.navy.mil'
ubtu24stig_chrony_server_options: "iburst maxpoll 16"  # Max Settings is maxpoll 16

# Filesystem and mount options
ubtu24stig_home_filesystem: /home

## SSHD
ubtu24stig_sshd_config_file: /etc/ssh/sshd_config
ubtu24stig_ssh_required: true
ubtu24stig_sshd_config:
ubtu24stig_sshd_config_banner_file: /etc/issue
ubtu24stig_sshd_config_ciphers: "aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr"
ubtu24stig_sshd_config_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
ubtu24stig_sshd_config_kex: "ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group14-sha256"

## 27XXXX GUI Settings
ubtu24stig_dconf_locald_files:
  - /etc/dconf/db/local.d/

ubtu24stig_dconf_db: local.d

### ACCOUNTS and AUTH ###
## PAM and password settings
ubtu24stig_pass:
  max_days: 60

# Path to set for users initialization files e.g. echo $PATH expected results
ubtu24stig_env_path: '$PATH:$HOME/.local/bin:$HOME/bin'

### Aide
ubtu24stig_use_aide: true
ubtu24stig_aide_cron_file: /etc/cron.daily/aide  # NOTE the path may change if not running daily
ubtu24stig_aide_cron:
  day: '*'
  hour: '4'
  minute: '30'
  job: '/usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil'
  name: 'Aide Job runs Daily at 0430'

### Rsyslog
# Set the following to true if the server accepts incoming syslog data using rsyslog
ubtu24stig_rsyslog_server: false

# Adjust to match remote syslog server configuration
ubtu24stig_remotelog_server:
  server: 10.10.10.10
  port: 9999
  protocol: '@@'

# 611xxx
# ubtu24stig_passwd_hash_algo is the hashing algorithm used - STIG required SHA512 - default is newer yescrypt
ubtu24stig_passwd_hash_algo: sha512 # pragma: allowlist secret

# 653xxx
### AUDITD
ubtu24stig_audit_log_filesystem: /var/log/audit
ubtu24stig_auditd_disk_full_action: HALT  # Can be one of "SYSLOG", "SINGLE", or "HALT"
ubtu24stig_auditd_log_group: root
ubtu24stig_auditd_email_acct: root
ubtu24stig_auditd_space_left: 25%
ubtu24stig_auditd_space_left_action: EMAIL  # Can be set to exec if running script to inform ISSO

# Adjust to match remote syslog server configuration
ubtu24stig_remotelog_server_address: 10.10.10.10



#######

# 400020
# Set to true if using smart card multifactor authentication
ubtu24stig_uses_smartcard: false
