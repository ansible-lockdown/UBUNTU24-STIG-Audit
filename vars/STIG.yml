# Variables

# If using sssd set to true
ubtu24stig_use_sssd: false


# Bootloader Settings
ubtu24stig_bootloader_password_hash: 'grub.pbkdf2.sha512.changethispassword' ## This needs to be changed

## UID:
MIN_UID: 1000
MAX_UID: 65000

ubtu24stig_logon_banner:
