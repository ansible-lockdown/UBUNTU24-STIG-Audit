---

{{ if .Vars.ubtu24stig_cat1 }}
  {{ if .Vars.ubtu24stig_300028 }}
command:
  nullok_common-password:
    title: UBTU-24-300028 | Ubuntu 24.04 LTS must not allow accounts configured in Pluggable Authentication Modules (PAM) with blank or null passwords.
    # Test passes when neither file contains the 'nullok' option. Previously
    # the test name had a typo (commn-password) and the stdout matcher was
    # '!/.*/' which fails on any output, even from grep -n line numbers.
    exec: grep nullok /etc/pam.d/common-password /etc/pam.d/common-auth
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/nullok/'
    meta:
      Cat: 1
      CCI: CCI-000366
      Group_Title: SRG-OS-000480-GPOS-00227
      NIST800-53R4: CM-6
      Rule_ID: SV-270714r1208699_rule
      STIG_ID: UBTU-24-300028
      Vul_ID: V-270714
  {{ end }}
{{ end }}
