---

{{ if .Vars.ubtu24stig_cat3 }}
  {{ if .Vars.ubtu24stig_200000 }}
command:
  maxlogins_security:
    title: UBTU-24-200000 | Ubuntu 24.04 LTS must limit the number of concurrent sessions to 10 for all accounts and/or account types.
    exec: grep -rhs '^[^#]*maxlogins' /etc/security/limits.conf /etc/security/limits.d/
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^\*\s+hard\s+maxlogins\s+([1-9]|10)\s*$/'
    - '!/^\S+\s+\S+\s+maxlogins\s+(0*1[1-9]|0*[2-9][0-9]|0*[1-9][0-9]{2,})\s*$/'
    meta:
      Cat: 3
      CCI: CCI-000054
      Group_Title: SRG-OS-000027-GPOS-00008
      NIST800-53R4: AC-10
      Rule_ID: SV-270677r1101774_rule
      STIG_ID: UBTU-24-200000
      Vul_ID: V-270677
  {{ end }}
{{ end }}
