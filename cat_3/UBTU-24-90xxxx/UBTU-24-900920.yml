    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^.*/'
    meta:
      Cat: 2
      CCI: CCI-001849
      Group_Title: SRG-OS-000341-GPOS-00132
      NIST800-53R4: AU-4
      Rule_ID: SV-270816r1066937_rule
